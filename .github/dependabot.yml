version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: America/Lima
    open-pull-requests-limit: 2
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - go
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: cargo
    directory: /rust/input-guard
    schedule:
      interval: weekly
      day: sunday
      time: "06:20"
      timezone: America/Lima
    open-pull-requests-limit: 1
    groups:
      rust-input-guard:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: cargo
    directory: /rust/input-guard-grpc
    schedule:
      interval: weekly
      day: sunday
      time: "06:40"
      timezone: America/Lima
    open-pull-requests-limit: 1
    groups:
      rust-input-guard-grpc:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
      - grpc
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "07:00"
      timezone: America/Lima
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "07:20"
      timezone: America/Lima
    open-pull-requests-limit: 1
    groups:
      docker-root:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: docker
    directory: /rust/input-guard-grpc
    schedule:
      interval: weekly
      day: sunday
      time: "07:40"
      timezone: America/Lima
    open-pull-requests-limit: 1
    groups:
      docker-grpc:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - docker
      - grpc
    commit-message:
      prefix: deps
      include: scope